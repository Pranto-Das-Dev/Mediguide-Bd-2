<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGuide BD | Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f8f5, #eaf2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #263746;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(20,60,80,.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .brand h1 {
            color: #087f72;
            font-size: 28px;
        }

        .brand p {
            color: #718096;
            font-size: 14px;
            margin-top: 7px;
        }

        .tabs {
            display: flex;
            background: #f0f5f5;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 15px;
            background: transparent;
            color: #52616b;
        }

        .tab.active {
            background: #087f72;
            color: white;
        }

        h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #718096;
            margin-bottom: 22px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d6e0e4;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #087f72;
            box-shadow: 0 0 0 3px rgba(8,127,114,.1);
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: #087f72;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #06665c;
        }

        .submit-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            color: #17663b;
            background: #e8f8ee;
        }

        .message.error {
            display: block;
            color: #a12626;
            background: #fff0f0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #087f72;
            text-decoration: none;
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        .note {
            font-size: 12px;
            color: #718096;
            margin-top: 8px;
            line-height: 1.5;
        }

        @media(max-width:480px) {
            .container {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <div class="brand">
        <div class="brand-icon">🩺</div>
        <h1>MediGuide BD</h1>
        <p>Your health information companion</p>
    </div>

    <div class="tabs">
        <button type="button" class="tab active" id="loginTab">
            Login
        </button>

        <button type="button" class="tab" id="registerTab">
            Register
        </button>
    </div>

    <div id="message" class="message" role="status"></div>

    <!-- Login Form -->
    <section id="loginSection">

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to your MediGuide BD account.</p>

        <form id="loginForm">

            <div class="field">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="150"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn" id="loginButton">
                Login
            </button>

        </form>
    </section>

    <!-- Registration Form -->
    <section id="registerSection" class="hidden">

        <h2>Create Account</h2>
        <p class="subtitle">Register to get started with MediGuide BD.</p>

        <form id="registerForm">

            <div class="field">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="100"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="150"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
                <p class="note">Use at least 8 characters.</p>
            </div>

            <button type="submit" class="submit-btn" id="registerButton">
                Create Account
            </button>

        </form>
    </section>

    <a href="index.html" class="back-link">
        ← Back to Health Search
    </a>

</main>

<script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');

    const loginSection = document.getElementById('loginSection');
    const registerSection = document.getElementById('registerSection');

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    const messageBox = document.getElementById('message');

    const loginButton = document.getElementById('loginButton');
    const registerButton = document.getElementById('registerButton');

    function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = 'message ' + type;
    }

    function clearMessage() {
        messageBox.textContent = '';
        messageBox.className = 'message';
    }

    function showLogin() {
        loginSection.classList.remove('hidden');
        registerSection.classList.add('hidden');

        loginTab.classList.add('active');
        registerTab.classList.remove('active');

        clearMessage();
    }

    function showRegister() {
        registerSection.classList.remove('hidden');
        loginSection.classList.add('hidden');

        registerTab.classList.add('active');
        loginTab.classList.remove('active');

        clearMessage();
    }

    loginTab.addEventListener('click', showLogin);
    registerTab.addEventListener('click', showRegister);

    async function sendRequest(url, data) {

        let response;

        try {
            response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify(data)
            });

        } catch (error) {
            throw new Error(
                'Server connection failed. Check whether backend is running.'
            );
        }

        const responseText = await response.text();

        let result = {};

        try {
            result = JSON.parse(responseText);
        } catch {
            result = {};
        }

        if (!response.ok) {
            throw new Error(
                result.error ||
                responseText.slice(0, 200) ||
                'Request failed. HTTP ' + response.status
            );
        }

        return result;
    }

    // Registration
    registerForm.addEventListener('submit', async function(event) {

        event.preventDefault();
        clearMessage();

        const fullName =
            document.getElementById('fullName').value.trim();

        const email =
            document.getElementById('registerEmail').value.trim();

        const password =
            document.getElementById('registerPassword').value;

        if (fullName.length < 2) {
            showMessage('Please enter your full name.', 'error');
            return;
        }

        if (password.length < 8) {
            showMessage('Password must be at least 8 characters.', 'error');
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = 'Creating Account...';

        try {

            const result = await sendRequest('/api/register', {
                full_name: fullName,
                email: email,
                password: password
            });

            showLogin();

            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = '';

            showMessage(
                result.message || 'Registration successful! Please login.',
                'success'
            );

            registerForm.reset();

        } catch (error) {

            showMessage(error.message, 'error');

        } finally {

            registerButton.disabled = false;
            registerButton.textContent = 'Create Account';

        }

    });

    // Login
    loginForm.addEventListener('submit', async function(event) {

        event.preventDefault();
        clearMessage();

        const email =
            document.getElementById('loginEmail').value.trim();

        const password =
            document.getElementById('loginPassword').value;

        loginButton.disabled = true;
        loginButton.textContent = 'Logging in...';

        try {

            const result = await sendRequest('/api/login', {
                email: email,
                password: password
            });

            showMessage(
                result.message || 'Login successful!',
                'success'
            );

            setTimeout(function() {
                window.location.href = 'dashboard.html';
            }, 1000);

        } catch (error) {

            showMessage(error.message, 'error');

        } finally {

            loginButton.disabled = false;
            loginButton.textContent = 'Login';

        }

    });
</script>

</body>
</html>
